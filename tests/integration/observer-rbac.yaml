# Disposable lab only; no credentials and no cluster mutation privileges.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: enforcement-observer
  namespace: prove-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prove-lab-enforcement-observer
rules:
  - apiGroups: [kyverno.io]
    resources: [clusterpolicies]
    resourceNames: [verify-provenance]
    verbs: [get]
  - apiGroups: ['']
    resources: [namespaces]
    resourceNames: [prove-lab]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prove-lab-enforcement-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prove-lab-enforcement-observer
subjects:
  - kind: ServiceAccount
    name: enforcement-observer
    namespace: prove-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: enforcement-observer
  namespace: prove-lab
rules:
  - apiGroups: ['']
    resources: [pods]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: enforcement-observer
  namespace: prove-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: enforcement-observer
subjects:
  - kind: ServiceAccount
    name: enforcement-observer
    namespace: prove-lab
