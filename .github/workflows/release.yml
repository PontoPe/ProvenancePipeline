name: release

# Third-party actions are pinned by commit SHA, never by tag. A tag is a mutable
# pointer an upstream maintainer (or whoever compromises them) can move; trusting
# one here is T3 of the threat model walking in through the front door. The
# human-readable version is kept in the trailing comment.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.mod
      - name: vet
        run: go vet ./...
        working-directory: app
      - name: test
        run: go test -race ./...
        working-directory: app

  build-sign-attest:
    name: build, sign, attest
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push image + signature + attestations to GHCR
      id-token: write # OIDC token exchanged with Fulcio for keyless signing
      attestations: write # actions/attest-build-provenance
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
      identity: ${{ steps.meta.outputs.identity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: compute image ref and signing identity
        id: meta
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # GHCR rejects uppercase path segments; github.repository preserves the
          # owner's casing, so it has to be folded.
          image="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          # The exact Fulcio SAN this workflow will get. Everything downstream —
          # the verify job, the Makefile, the Kyverno policy — pins this string.
          echo "identity=https://github.com/${REPOSITORY}/.github/workflows/release.yml@${REF}" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"
          # GitHub's attestation API is unavailable on user-owned private repos.
          # Read the real visibility rather than assuming it, so the workflow
          # starts producing GitHub attestations by itself if the repo is ever
          # made public. ADR-005.
          echo "private=${{ github.event.repository.private }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: build/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('0.0.0-{0}', github.sha) }}
            REVISION=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.meta.outputs.source_date_epoch }}
          # buildx would otherwise attach its own unsigned in-toto attestations as
          # extra manifests in the index. We produce signed ones below instead, and
          # a single-subject index keeps the digest that cosign signs unambiguous.
          # ADR-004.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SBOM (syft, SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: SBOM (syft, CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      # The gate. It fails the build on CRITICAL and there is deliberately no
      # continue-on-error, no soft-fail and no allowlist: a gate that is switched
      # off to make a run green is worse than no gate, because it also lies.
      # Threshold rationale: ADR-003.
      - name: vulnerability gate (grype)
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: sbom.spdx.json
          fail-build: true
          severity-cutoff: critical
          output-format: table

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: sign image (keyless)
        env:
          REF: ${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$REF"

      - name: attest SBOM (SPDX)
        env:
          REF: ${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"

      # A second, cosign-native provenance attestation on top of
      # actions/attest-build-provenance below. Reason: this repository is private,
      # so GitHub's attestation is issued by its internal Sigstore instance and is
      # only verifiable with `gh attestation verify`. Kyverno speaks cosign, not
      # gh — so the copy the cluster will actually enforce has to live in public
      # Rekor. ADR-005.
      - name: build SLSA provenance predicate
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY_ID: ${{ github.repository_id }}
          REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          IDENTITY: ${{ steps.meta.outputs.identity }}
          STARTED_ON: ${{ github.event.repository.pushed_at }}
        run: |
          set -euo pipefail
          jq -n \
            --arg repository "$REPOSITORY" \
            --arg ref "$REF" \
            --arg sha "$SHA" \
            --arg run_id "$RUN_ID" \
            --arg run_attempt "$RUN_ATTEMPT" \
            --arg event_name "$EVENT_NAME" \
            --arg repository_id "$REPOSITORY_ID" \
            --arg repository_owner_id "$REPOSITORY_OWNER_ID" \
            --arg identity "$IDENTITY" \
            --arg finished_on "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              buildDefinition: {
                buildType: "https://github.com/PontoPe/ProvenancePipeline/build-types/github-actions/v1",
                externalParameters: {
                  workflow: {
                    ref: $ref,
                    repository: ("https://github.com/" + $repository),
                    path: ".github/workflows/release.yml"
                  }
                },
                internalParameters: {
                  github: {
                    event_name: $event_name,
                    repository_id: $repository_id,
                    repository_owner_id: $repository_owner_id
                  }
                },
                resolvedDependencies: [
                  {
                    uri: ("git+https://github.com/" + $repository + "@" + $ref),
                    digest: { gitCommit: $sha }
                  }
                ]
              },
              runDetails: {
                builder: { id: $identity },
                metadata: {
                  invocationId: ("https://github.com/" + $repository + "/actions/runs/" + $run_id + "/attempts/" + $run_attempt),
                  finishedOn: $finished_on
                }
              }
            }' > provenance.json
          jq . provenance.json

      - name: attest SLSA provenance (cosign)
        env:
          REF: ${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}
        run: cosign attest --yes --type slsaprovenance1 --predicate provenance.json "$REF"

      # Skipped while the repository is private: the attestations API answers
      # "Feature not available for user-owned private repositories". This is a
      # platform limit, not a relaxed control — the cosign slsaprovenance1
      # attestation above is the SLSA provenance this project actually depends
      # on, and unlike this one it is verifiable from public Rekor by Kyverno.
      - name: attest build provenance (GitHub)
        if: steps.meta.outputs.private != 'true'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: |
            sbom.spdx.json
            sbom.cdx.json
            provenance.json

  verify:
    name: verify
    needs: build-sign-attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write # gh attestation verify against GitHub's instance
      attestations: read
    env:
      REF: ${{ needs.build-sign-attest.outputs.image }}@${{ needs.build-sign-attest.outputs.digest }}
      IDENTITY: ${{ needs.build-sign-attest.outputs.identity }}
      ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The package is private; cosign reads the docker credential store.
      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Identity AND issuer, both exact. Identity alone is forgeable by any other
      # OIDC issuer Fulcio accepts; issuer alone is every GitHub workflow on earth.
      - name: verify signature
        run: |
          cosign verify \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" \
            "$REF" | jq .

      - name: verify SBOM attestation
        run: |
          cosign verify-attestation \
            --type spdxjson \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" \
            "$REF" | jq -r '.payload | @base64d | fromjson | .predicateType'

      - name: verify SLSA provenance attestation
        run: |
          cosign verify-attestation \
            --type slsaprovenance1 \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" \
            "$REF" | jq -r '.payload | @base64d | fromjson | .predicate'

      - name: verify GitHub build provenance
        if: needs.build-sign-attest.result == 'success' && github.event.repository.private != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh attestation verify "oci://$REF" \
            --repo "${{ github.repository }}" \
            --signer-workflow "${{ github.repository }}/.github/workflows/release.yml"

      # A tampered digest must fail. Without this the verify job only proves the
      # happy path, and a verifier that never says no is not a verifier.
      - name: negative control — a digest we never signed must fail
        run: |
          set +e
          FAKE="sha256:$(printf 'not-the-image' | sha256sum | cut -d' ' -f1)"
          out=$(cosign verify \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" \
            "${{ needs.build-sign-attest.outputs.image }}@${FAKE}" 2>&1)
          rc=$?
          set -e
          if [ $rc -eq 0 ]; then
            echo "::error::cosign verified an image we never signed"
            exit 1
          fi
          echo "expected failure, rc=$rc:"
          echo "$out"

      # The evidence file is generated here rather than written by hand, so it
      # cannot drift from what the pipeline actually produces. Downloaded from
      # this run's artifacts and committed to docs/evidence/.
      - name: capture Rekor transparency log entries
        id: rekor
        run: |
          set -uo pipefail
          # cosign v3 stops printing the log index on sign and leaves the inlined
          # Bundle null, so the index is looked up from Rekor itself. For a
          # hashedrekord the indexed artifact hash is the sha256 of the signed
          # payload, which `cosign download signature` still hands us.
          : > rekor-entries.txt
          cosign download signature "$REF" > sigs.ndjson 2>/dev/null || true
          echo "signature envelopes: $(wc -l < sigs.ndjson)"
          echo "envelope keys: $(jq -r 'keys_unsorted | join(",")' sigs.ndjson 2>/dev/null | sort -u | tr '\n' ' ')"

          # Key-name agnostic: cosign has moved this field's casing between
          # versions and guessing it wrong silently yields zero entries.
          jq -r 'to_entries[] | select(.key | ascii_downcase == "payload") | .value' sigs.ndjson 2>/dev/null \
            | sort -u | while read -r p; do
            h=$(printf '%s' "$p" | base64 -d 2>/dev/null | sha256sum | cut -d' ' -f1)
            [ -z "$h" ] && continue
            uuids=$(curl -sS --max-time 30 -X POST https://rekor.sigstore.dev/api/v1/index/retrieve \
              -H 'Content-Type: application/json' -d "{\"hash\":\"sha256:${h}\"}" | jq -r '.[]?' 2>/dev/null)
            for u in $uuids; do
              curl -sS --max-time 30 "https://rekor.sigstore.dev/api/v1/log/entries/${u}" \
                | jq -r --arg u "$u" '.[] | "uuid=\($u) logIndex=\(.logIndex) logID=\(.logID) integratedTime=\(.integratedTime)"' \
                >> rekor-entries.txt 2>/dev/null
            done
          done

          sort -u -o rekor-entries.txt rekor-entries.txt
          if [ ! -s rekor-entries.txt ]; then
            echo "no Rekor entries resolved" > rekor-entries.txt
          fi
          cat rekor-entries.txt

      - name: generate evidence file
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          exec > evidence.md
          echo "# Supply-chain verification — captured output"
          echo
          echo "Machine-generated by the \`verify\` job of [\`release.yml\`](../../.github/workflows/release.yml)."
          echo "Every block below is the real stdout of the command shown, not a transcription."
          echo
          echo "- run: $RUN_URL"
          echo "- image: \`$REF\`"
          echo "- certificate identity: \`$IDENTITY\`"
          echo "- certificate OIDC issuer: \`$ISSUER\`"
          echo "- cosign: \`$(cosign version 2>/dev/null | awk '/GitVersion/{print $2}')\`"
          echo "- captured: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo
          echo "## cosign verify — signature bound to the workflow identity"
          echo
          echo '```console'
          echo "\$ cosign verify --certificate-identity $IDENTITY --certificate-oidc-issuer $ISSUER $REF"
          # cosign writes the human-readable checklist to stderr and the payload
          # JSON to stdout. Keeping them apart is what let the attestation blocks
          # come out empty the first time this ran.
          cosign verify --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$REF" \
            > verify.json 2> verify.err
          cat verify.err
          jq . verify.json
          echo '```'
          echo
          echo "## cosign verify-attestation — SBOM (SPDX)"
          echo
          echo '```console'
          echo "\$ cosign verify-attestation --type spdxjson ... $REF"
          cosign verify-attestation --type spdxjson \
            --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$REF" \
            > sbom-att.json 2> sbom-att.err
          cat sbom-att.err
          jq -r '.payload | @base64d | fromjson | {_type, predicateType, subject}' sbom-att.json
          echo
          echo "# packages recorded in the attested SBOM:"
          jq -r '.payload | @base64d | fromjson | .predicate.packages | length' sbom-att.json
          echo '```'
          echo
          echo "## cosign verify-attestation — SLSA provenance v1"
          echo
          echo '```console'
          echo "\$ cosign verify-attestation --type slsaprovenance1 ... $REF"
          cosign verify-attestation --type slsaprovenance1 \
            --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$REF" \
            > slsa-att.json 2> slsa-att.err
          cat slsa-att.err
          jq -r '.payload | @base64d | fromjson | {_type, predicateType, subject, predicate}' slsa-att.json
          echo '```'
          echo
          echo "## Rekor transparency log"
          echo
          echo "Resolved from Rekor's public index by the sha256 of each signed payload."
          echo
          echo '```console'
          cat rekor-entries.txt 2>/dev/null || echo "(not captured)"
          echo '```'
          echo
          sed -n 's/.*logIndex=\([0-9][0-9]*\).*/- Rekor entry: <https:\/\/search.sigstore.dev\/?logIndex=\1>/p' \
            rekor-entries.txt 2>/dev/null | sort -u
          echo
          echo "## Negative control — an unsigned digest must be refused"
          echo
          echo "A verifier that never says no proves nothing. The \`verify\` job asserts this and fails the build if it succeeds."
          echo
          echo '```console'
          FAKE="sha256:$(printf 'not-the-image' | sha256sum | cut -d' ' -f1)"
          echo "\$ cosign verify --certificate-identity ... ${{ needs.build-sign-attest.outputs.image }}@\${FAKE}"
          cosign verify --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" \
            "${{ needs.build-sign-attest.outputs.image }}@${FAKE}" 2>&1 || echo "[exit $?]"
          echo '```'

      - name: upload evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence
          path: |
            evidence.md
            rekor-entries.txt
