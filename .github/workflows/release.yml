name: release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write        # required for cosign keyless (Fulcio)
  attestations: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-sign-attest:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build + push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: build
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: scan (grype) — gate
        uses: anchore/scan-action@v5
        with:
          sbom: sbom.spdx.json
          fail-build: true
          severity-cutoff: critical

      - uses: sigstore/cosign-installer@v3

      - name: sign (keyless)
        run: cosign sign --yes ${IMAGE}@${{ steps.push.outputs.digest }}

      - name: attest SBOM
        run: |
          cosign attest --yes --type spdxjson \
            --predicate sbom.spdx.json \
            ${IMAGE}@${{ steps.push.outputs.digest }}

      - name: SLSA provenance attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  verify:
    needs: build-sign-attest
    runs-on: ubuntu-latest
    steps:
      - uses: sigstore/cosign-installer@v3
      - name: verify as the cluster policy does
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            ${IMAGE}@${{ needs.build-sign-attest.outputs.digest }}
